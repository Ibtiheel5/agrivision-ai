stages:
  prepare:
    cmd: python -m src.data.dataset --params params.yaml
    deps: [src/data/dataset.py, data/raw]
    params: [data, seed]
    outs: [data/processed]
  train:
    cmd: python -m src.models.train --params params.yaml
    deps: [src/models/train.py, src/models/architecture.py, data/processed]
    params: [train, mlflow, seed]
    outs: [models/best.pt]
  evaluate:
    cmd: python -m src.models.evaluate --params params.yaml
    deps: [src/models/evaluate.py, models/best.pt, data/processed]
    params: [evaluate]
    metrics: [reports/metrics.json]
  export:
    cmd: python -m src.models.export_onnx --params params.yaml
    deps: [src/models/export_onnx.py, models/best.pt]
    params: [export]
    outs: [models/best.onnx]
    metrics: [reports/onnx_benchmark.json]
