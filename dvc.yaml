# L'entraînement se fait dans le notebook Kaggle (notebooks/agrivision_complet_v2.ipynb) :
# les poids et métriques arrivent dans models/ et sont suivis par DVC (models/*.dvc).
# Cette étape applique la porte d'évaluation sur le modèle présent.
# Avant : python scripts/benchmark_latency.py  (écrit models/benchmark_local.json)
stages:
  gate:
    cmd: python scripts/check_gate.py
    deps:
      - models/best.onnx
      - models/metrics.json
      - models/inference_config.json
      - models/benchmark_local.json
      - scripts/check_gate.py
    params:
      - gate
