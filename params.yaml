train:
  model: yolo11s.pt        # meilleur run (validation) : B2_mapping_corrige
  imgsz: 640
  epochs: 40               # plafond ; l'entraÃ®nement est aussi limitÃ© par time_hours
  time_hours: 0.8
  batch: 32
  patience: 10
  experiment: agrivision
  augment: {mosaic: 1.0, mixup: 0.1, hsv_h: 0.01, hsv_s: 0.7, hsv_v: 0.4, fliplr: 0.5, flipud: 0.2, degrees: 10, translate: 0.1, scale: 0.5, close_mosaic: 5, cos_lr: true}
inference:
  conf: 0.30               # seuil retenu sur la validation (F1 quasi plat de 0.15 Ã  0.40 ; 0.25 possible pour dÃ©tecter plus)
  iou: 0.45
  imgsz: 640
export:
