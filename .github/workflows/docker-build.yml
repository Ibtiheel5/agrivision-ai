name: docker-build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v6
        with: { context: ./backend, push: false, tags: agrivision-backend:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Build frontend
        uses: docker/build-push-action@v6
        with: { context: ./frontend, push: false, tags: agrivision-frontend:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Valider docker-compose.yml
        run: docker compose config -q
