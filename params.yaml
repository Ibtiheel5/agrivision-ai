seed: 42
data:
  raw_dir: data/raw
  processed_dir: data/processed
  datasets:            # sources fusionnées (PlantDoc val/test, PlantSeg train seulement)
    plantdoc: data/raw/plantdoc
    plantseg: data/raw/plantseg
  split: {train: 0.8, val: 0.1, test: 0.1}   # utilisé seulement pour les sources sans split officiel
  dedup_hash_size: 8          # taille du dHash pour détecter les doublons / quasi-doublons
  class_merge:                # fusion de classes équivalentes (orthographe)
    Soyabean: Soybean
train:
  model: yolo11s.pt
  imgsz: 640
  epochs: 100
  batch: 16
  patience: 20
  optimizer: auto
  augment: {mosaic: 1.0, hsv_h: 0.015, hsv_s: 0.7, hsv_v: 0.4, fliplr: 0.5, scale: 0.5}
mlflow:
  tracking_uri: http://localhost:5000
  experiment: agrivision-ia-v4
evaluate:
  conf: 0.30
  iou: 0.45
  gate: {min_map50: 0.50, max_latency_p95_ms: 150}   # porte d'évaluation avant "Production"
export:
  opset: 17
  simplify: true
  onnx_path: models/best.onnx
