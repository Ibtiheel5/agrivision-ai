name: publish-image
on:
  push:
    branches: [main]
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: docker build -t ghcr.io/ibtiheel5/agrivision-api:${{ github.sha }} ./backend
      - run: docker push ghcr.io/ibtiheel5/agrivision-api:${{ github.sha }}
